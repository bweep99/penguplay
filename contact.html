<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | PenguPlay</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-body" data-page="contact">
    <!-- Navbar -->
    <button class="menu-toggle glass-liquid" id="menuToggle"><i class="fa-solid fa-bars"></i></button>
    <nav class="sidebar glass-liquid" id="sidebar">
        <button class="close-sidebar" id="closeSidebar"><i class="fa-solid fa-xmark"></i></button>
        <h2 class="sidebar-brand"><i class="fa-solid fa-igloo"></i> Menu</h2>
        <a href="home.html"><i class="fa-solid fa-gamepad"></i> Play Game</a>
        <a href="profile.html"><i class="fa-solid fa-user"></i> My Profile</a>
        <a href="about.html"><i class="fa-solid fa-circle-info"></i> About Us</a>
        <a href="contact.html" class="active"><i class="fa-solid fa-envelope"></i> Contact</a>
        <a href="#" class="logout" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
    </nav>
    
    <canvas id="bgCanvas"></canvas>

    <!-- Card Form -->
    <div class="glass-card">
        <div class="card-header">
            <h2><i class="fa-solid fa-paper-plane"></i> Get In Touch</h2>
            <p>Send a message to the Ice Headquarters!</p>
        </div>
        <form id="contactForm">
            <div class="input-group">
                <i class="fa-solid fa-user input-icon"></i>
                <input type="text" id="contactName" required placeholder=" ">
                <label for="contactName">Your Name</label>
            </div>
            <div class="input-group">
                <i class="fa-solid fa-envelope input-icon"></i>
                <input type="email" id="contactEmail" required placeholder=" ">
                <label for="contactEmail">Your Email</label>
            </div>
            <div class="input-group textarea-group">
                <i class="fa-solid fa-pen input-icon" style="top:25px;"></i>
                <textarea id="contactMessage" required placeholder=" " rows="5"></textarea>
                <label for="contactMessage">Your Message</label>
            </div>
            <button type="submit" class="btn-primary">Send Message <i class="fa-solid fa-paper-plane"></i></button>
        </form>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
